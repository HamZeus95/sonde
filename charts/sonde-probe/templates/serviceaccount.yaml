{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonde-probe.serviceAccountName" . }}
  labels: {{- include "sonde-probe.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The probe reads the API; nothing reads it back. No token is mounted for any
# purpose other than the checks themselves.
automountServiceAccountToken: true
{{- end }}
