{{- if and .Values.enrolment.token (not .Values.enrolment.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sonde-probe.enrolmentSecretName" . }}
  labels: {{- include "sonde-probe.labels" . | nindent 4 }}
  annotations:
    # The token is spent on first start. Helm keeps values in its release
    # history, so this Secret outlives its usefulness; delete it once the probe
    # has enrolled.
    sonde.dev/note: "single use, fifteen minute lifetime"
type: Opaque
stringData:
  {{ .Values.enrolment.secretKey }}: {{ .Values.enrolment.token | quote }}
{{- end }}
{{- if and .Values.controlPlane.caCert (not .Values.controlPlane.existingCaSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sonde-probe.fullname" . }}-ca
  labels: {{- include "sonde-probe.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.controlPlane.caCert | quote }}
{{- end }}
